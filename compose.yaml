services:
  backend:
    build: 
    # builds image via Dockerfile
      context: ./backend
    ports:
      - "5000:8080"
      # maps a container port to computer
    environment:
    # provides configuration, including database connection settings
     ASPNETCORE_ENVIRONMENT: Development
     ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=hotelbooking;Username=hoteluser;Password=${POSTGRES_PASSWORD}"
     Admin__Username: ${ADMIN_USERNAME}
     Admin__Password: ${ADMIN_PASSWORD}
     Manager__Username: ${MANAGER_USERNAME}
     Manager__Password: ${MANAGER_PASSWORD}
    depends_on:
    # controls service startup order
     db:
      condition: service_healthy 

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: hotelbooking
      POSTGRES_USER: hoteluser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
     
    volumes:
    # directory inside the container where the volume is mounted
      - postgres_data:/var/lib/postgresql
    healthcheck:
    # checks whether PostgreSQL is ready to accept connections
     test: ["CMD-SHELL", "pg_isready -U hoteluser -d hotelbooking"]
     interval: 5s
     timeout: 5s
     retries: 10
# storage managed by Docker, exists independently of a container
# volume preserves important data even when containers are deleted or recreated
volumes:
  postgres_data: