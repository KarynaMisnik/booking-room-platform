services:
  backend:
    build:
      context: ./backend
    ports:
      - "5000:8080"
    environment:
     ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=hotelbooking;Username=hoteluser;Password=${POSTGRES_PASSWORD}"

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: hotelbooking
      POSTGRES_USER: hoteluser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: