services:
  backend:
    build: 
    # builds image via Dockerfile
      context: ./backend
    ports:
      - "5000:8080"
      # maps a container port to computer
    environment:
    # provides configuration, including database connection settings
     ASPNETCORE_ENVIRONMENT: Development
     ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=hotelbooking;Username=hoteluser;Password=${POSTGRES_PASSWORD}"
    depends_on:
    # controls service startup order
     db:
      condition: service_healthy 

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: hotelbooking
      POSTGRES_USER: hoteluser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
    # preserves database data when containers are removed
      - postgres_data:/var/lib/postgresql
    healthcheck:
    # checks whether PostgreSQL is ready to accept connections
     test: ["CMD-SHELL", "pg_isready -U hoteluser -d hotelbooking"]
     interval: 5s
     timeout: 5s
     retries: 10

volumes:
  postgres_data: